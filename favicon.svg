<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="weehog.ai — crisp green apple and geometric hedgehog">
  <defs>
    <mask id="apple-cut">
      <rect width="64" height="64" fill="#fff"/>
      <path d="M25 55 L22 46.5 L27.5 45 L26 37 L32 39 L34 31.5 L39 36.5 L43 32 L45.5 37.5 L50 35 L48.5 41.5 L59.5 50 L46 55 Z"
            fill="#000" stroke="#000" stroke-width="5.5" stroke-linejoin="round"/>
    </mask>
  </defs>
  <style>
    .stem { stroke: #594330; }
    .apple { fill: #44b72e; stroke: #247317; }
    .apple-shade { fill: #369e23; }
    .leaf { fill: #67d649; stroke: #247317; }
    .shine { stroke: #ffffff; stroke-opacity: 0.58; }
    .f1 { fill: #232c27; }
    .f2 { fill: #34423a; }
    .f3 { fill: #1b231f; }
    .f4 { fill: #39483f; }
    .f5 { fill: #28332d; }
    .shell-rim { stroke: #151b18; }
    .snout-top { fill: #ead0aa; }
    .snout-jaw { fill: #d4b183; }
    .snout-rim { stroke: #232c27; }
    .ear { fill: #39483f; stroke: #151b18; }
    .feature { fill: #141916; }
    .feet { stroke: #232c27; }
    @media (prefers-color-scheme: dark) {
      .stem { stroke: #9e856d; }
      .apple { fill: #4ec936; stroke: #2c8a1d; }
      .apple-shade { fill: #3eb028; }
      .leaf { fill: #74e055; stroke: #2c8a1d; }
      .f1 { fill: #2a352f; }
      .f2 { fill: #3d4d44; }
      .f3 { fill: #222b26; }
      .f4 { fill: #45574d; }
      .f5 { fill: #313e37; }
      .shell-rim { stroke: #7b9182; }
      .snout-rim { stroke: #7b9182; }
      .ear { fill: #45574d; stroke: #7b9182; }
      .feet { stroke: #8ca193; }
    }
  </style>

  <!-- Crisp green apple (masked with true transparent cutout around hedgehog) -->
  <g mask="url(#apple-cut)">
    <path class="stem" d="M25.5 16.5 C25.5 11.5 27.5 8 30.8 5.8" fill="none" stroke-width="2.6" stroke-linecap="round"/>
    <path class="apple" d="M25.5 17.5 C21 13 11.8 13.2 7.8 21.5 C3.8 30 6.5 43.5 15 50.5 C19 53.8 22.8 53 25.5 50.8 C28.2 53 32 53.8 36 50.5 C44.5 43.5 47.2 30 43.2 21.5 C39.2 13.2 30 13 25.5 17.5 Z" stroke-width="1.8" stroke-linejoin="round"/>
    <path class="apple-shade" d="M25.5 18.4 C29.6 14.3 38.2 14.5 42 22 C45.5 29.5 43.2 42.2 35.4 49.2 C31.8 52.2 28.4 51.6 25.5 49.6 C31 46 34.5 34 25.5 18.4 Z" opacity="0.45"/>
    <path class="shine" d="M13.5 23.5 C11.2 28.5 11.8 35 14.5 40" fill="none" stroke-width="2.5" stroke-linecap="round"/>
    <path class="leaf" d="M27.2 12.6 C31.2 6.5 40.5 6.5 42.6 12 C37.6 16 31 15.8 27.2 12.6 Z" stroke-width="1.6" stroke-linejoin="round"/>
  </g>

  <!-- Wee geometric hedgehog: low-poly faceted armor -->
  <g stroke-linejoin="round">
    <polygon class="f1" points="25,55 22,46.5 27.5,45 37,55"/>
    <polygon class="f2" points="37,55 27.5,45 26,37 32,39"/>
    <polygon class="f3" points="37,55 32,39 34,31.5 39,36.5"/>
    <polygon class="f4" points="37,55 39,36.5 43,32 45.5,37.5"/>
    <polygon class="f5" points="37,55 45.5,37.5 50,35 48.5,41.5 45,48.5 46,55"/>
    <path class="shell-rim" d="M25 55 L22 46.5 L27.5 45 L26 37 L32 39 L34 31.5 L39 36.5 L43 32 L45.5 37.5 L50 35 L48.5 41.5 L45 48.5 L46 55 Z" fill="none" stroke-width="1.3"/>

    <!-- Faceted snout -->
    <polygon class="snout-top" points="48.5,41.5 59.5,50 45,48.5"/>
    <polygon class="snout-jaw" points="45,48.5 59.5,50 46,55"/>
    <path class="snout-rim" d="M48.5 41.5 L59.5 50 L46 55" fill="none" stroke-width="1.3" stroke-linecap="round"/>

    <!-- Ear, eye, nose & feet -->
    <circle class="ear" cx="45.5" cy="42.5" r="2.1" stroke-width="1.2"/>
    <circle class="feature" cx="51.2" cy="46.8" r="1.5"/>
    <circle class="feature" cx="59.2" cy="50" r="2"/>
    <path class="feet" d="M31 55.3 L31 57.8 M42.5 55.3 L42.5 57.8" fill="none" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
